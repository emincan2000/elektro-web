<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>elektro web</title>
  <meta name="description" content="Electrical & electronics engineering calculations in the browser — the elektro toolkit, running locally via Pyodide.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu" aria-expanded="false">☰</button>
    <a class="brand" href="#" id="home-link"><span class="bolt" aria-hidden="true">⚡</span> elektro <span class="brand-sub">web</span></a>
    <div class="top-right">
      <label class="visually-hidden" for="lang">Language</label>
      <select id="lang">
        <option value="tr">Türkçe</option>
        <option value="en">English</option>
        <option value="de">Deutsch</option>
        <option value="ru">Русский</option>
      </select>
      <button class="icon-btn" id="theme-btn" aria-label="Theme">◐</button>
      <a class="icon-btn github-btn" href="https://github.com/emincan2000/elektro-web" target="_blank" rel="noopener" aria-label="GitHub Repository" title="GitHub">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Commands">
      <div class="search-wrap">
        <div class="search-box">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input type="search" id="search" autocomplete="off" spellcheck="false">
          <kbd class="search-kbd" title="Shortcut: /">/</kbd>
        </div>
      </div>
      <div id="nav"></div>
    </nav>

    <main id="main" tabindex="-1">
      <section id="loading" class="loading" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <ol class="steps" id="steps"></ol>
        <p class="loading-note" id="loading-note"></p>
      </section>
      <section id="view" hidden></section>
    </main>
  </div>

  <footer class="foot" id="foot"></footer>
</body>
</html>
